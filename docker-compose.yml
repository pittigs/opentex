version: '3.8'

services:
  opentex-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opentex-suite
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
