<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="leftBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="rightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="axiomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#2563eb" stroke-width="6" stroke-opacity="0.4" />

  <!-- Axiom Stylized Glyph (Apex Delta / Mathematical 'A') -->
  <g filter="url(#axiomGlow)">
    <!-- Left Leg -->
    <path d="M 256 96 L 128 384 L 176 384 L 256 196 Z" fill="url(#leftBeam)" />
    <!-- Right Leg -->
    <path d="M 256 96 L 256 196 L 336 384 L 384 384 Z" fill="url(#rightBeam)" />
    <!-- Crossbar -->
    <rect x="168" y="272" width="176" height="28" rx="8" fill="url(#goldBeam)" />
    <!-- Central Quantum Spark -->
    <circle cx="256" cy="286" r="14" fill="#ffffff" />
    <circle cx="256" cy="96" r="16" fill="#38bdf8" />
    <circle cx="256" cy="96" r="8" fill="#ffffff" />
  </g>
</svg>